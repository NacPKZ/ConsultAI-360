
name: ConsultAI 360 Health Monitor

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Streamlit health
        shell: bash
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "https://consultai-360.streamlit.app/_stcore/health"

          for attempt in range(1, 9):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      status = response.status
                      body = response.read().decode().strip()

                  print(f"Attempt {attempt}: HTTP {status}")
                  print(f"Response: {body}")

                  if status == 200 and body.lower() == "ok":
                      print("SUCCESS: Streamlit server healthy")
                      break

              except Exception as error:
                  print(f"Attempt {attempt}: {error}")

              if attempt == 8:
                  raise SystemExit("FAILED: Health check")

              time.sleep(15)
          PY
