
name: Keep ConsultAI 360 Awake

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: Diagnose ConsultAI 360
        run: |
          cat > /tmp/check_app.py <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://consultai-360.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              page.on(
                  "pageerror",
                  lambda error: print("JS ERROR:", error)
              )

              page.on(
                  "console",
                  lambda msg: print("CONSOLE:", msg.text)
                  if msg.type == "error" else None
              )

              page.on(
                  "websocket",
                  lambda ws: print("WEBSOCKET:", ws.url)
              )

              try:
                  response = page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=90000
                  )

                  page.wait_for_timeout(15000)

                  print("HTTP:", response.status if response else "None")
                  print("URL:", page.url)
                  print("TITLE:", page.title())
                  print(
                      "BODY:",
                      repr(page.locator("body").inner_text()[:1000])
                  )
                  print(
                      "STREAMLIT:",
                      page.locator('[data-testid="stApp"]').count()
                  )

                  if page.locator('[data-testid="stApp"]').count() == 0:
                      raise RuntimeError(
                          "Streamlit interface not detected"
                      )

                  print("SUCCESS: ConsultAI 360 loaded")

              finally:
                  browser.close()
          PY

          python /tmp/check_app.py
